name: Tandas Telegram

on:
  # GitHub retrasa (a veces horas) o se salta las ejecuciones programadas, así que
  # se comprueba cada 15 min y se publica la tanda que toque si aún no ha salido.
  schedule:
    - cron: "7,22,37,52 6-22 * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Publicar aunque la tanda de esta hora ya haya salido"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tandas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: hora
        id: hora
        run: |
          h=$(TZ=Europe/Madrid date +%-H)
          tanda=""
          for t in 9 12 15 18 21; do [ "$h" -ge "$t" ] && tanda=$t; done
          clave="$(TZ=Europe/Madrid date +%F) $tanda"
          ultima=$(cat ultima-tanda.txt 2>/dev/null || true)
          echo "Hora en Madrid: $h, tanda: ${tanda:-ninguna}, última publicada: ${ultima:-ninguna}"
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.forzar }}" != "false" ]; } || { [ -n "$tanda" ] && [ "$clave" != "$ultima" ]; }; then
            echo "toca=si" >> "$GITHUB_OUTPUT"
            echo "clave=$clave" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Pillow (para reducir las fotos QC)
        if: steps.hora.outputs.toca == 'si'
        run: python3 -m pip install --quiet pillow || true

      - name: Publicar 3 mensajes
        if: steps.hora.outputs.toca == 'si'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TZ: Europe/Madrid
        run: python3 publicar.py 3

      - name: Marcar tanda publicada
        if: steps.hora.outputs.toca == 'si'
        run: echo "${{ steps.hora.outputs.clave }}" > ultima-tanda.txt

      - name: Guardar cola y publicados
        if: always() && steps.hora.outputs.toca == 'si'
        run: |
          git config user.name "pandasito-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Tanda $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
